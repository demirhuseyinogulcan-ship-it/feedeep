name: Haber Tara & Arşivle

on:
  schedule:
    # Her gün 06:00, 12:00, 18:00 UTC (09:00, 15:00, 21:00 TR)
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Kaynak başına max haber sayısı'
        default: '10'
        required: false
      sadece_rss:
        description: 'Yalnızca RSS mi? (scraper dahil et = false)'
        type: boolean
        default: false

jobs:
  tara:
    name: Haber Topla
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-haber-takip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ai-haber-takip/package-lock.json

      - name: Bağımlılıkları yükle
        run: npm ci

      # ── RSS beslemelerini tara ──────────────────────────────
      - name: RSS tara
        run: |
          LIMIT="${{ github.event.inputs.limit || '10' }}"
          node haberler.mjs --kaydet --limit "$LIMIT"

      # ── HTML scraper (sadece_rss false ise) ────────────────
      - name: HTML scraper tara
        if: ${{ github.event.inputs.sadece_rss != 'true' }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '10' }}"
          node tarayici.mjs --kaydet --filter-ai --limit "$LIMIT" --hizli

      # ── Veritabanı değişti mi kontrol et ──────────────────
      - name: Değişiklik var mı?
        id: degisiklik
        run: |
          git diff --quiet veritabani.json && echo "degisti=false" >> $GITHUB_OUTPUT || echo "degisti=true" >> $GITHUB_OUTPUT

      # ── Değiştiyse commit & push ───────────────────────────
      - name: Commit ve push
        if: steps.degisiklik.outputs.degisti == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TARIH=$(date '+%Y-%m-%d %H:%M UTC')
          git add veritabani.json arsiv/
          git commit -m "chore(haber): otomatik tarama — $TARIH"
          git push

      # ── Yeni haber sayısını job summary'ye yaz ─────────────
      - name: Özet
        if: always()
        run: |
          node arsiv.mjs 2>/dev/null | head -30 >> "$GITHUB_STEP_SUMMARY" || echo "Özet alınamadı" >> "$GITHUB_STEP_SUMMARY"
