      <stop offset="18%" stop-color="#a855f7"/>
      <stop offset="36%" stop-color="#d946ef"/>
      <stop offset="54%" stop-color="#ec4899"/>
      <stop offset="72%" stop-color="#d946ef"/>
      <stop offset="88%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
      <animate attributeName="x1" values="-720;72;-720" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="480;930;480" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="brandTop" x1="-140" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
